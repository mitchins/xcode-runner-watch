name: publish-macos-latest

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      verify_publication:
        description: "Verify the bot PR and squash path by publishing a fresh real capture, even if only observed_at changes"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-macos-latest
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Capture manifest
        id: capture
        env:
          VERIFY_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_publication }}
        shell: bash
        run: |
          set -euo pipefail

          temp_manifest="$(mktemp)"
          RUNNER_LABEL="macos-latest" ./scripts/capture-xcode-runner-manifest.sh "$temp_manifest"

          if [[ "${VERIFY_PUBLICATION:-false}" == "true" ]]; then
            echo "Manual publication verification: publishing a fresh real capture, including its observation timestamp." >>"$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f latest/macos-latest.json && "${VERIFY_PUBLICATION:-false}" != "true" ]]; then
            set +e
            python3 - "$temp_manifest" latest/macos-latest.json <<'PY'
          import json
          import sys
          from pathlib import Path


          def canonical(value):
              if isinstance(value, dict):
                  return {
                      key: canonical(item)
                      for key, item in sorted(value.items())
                      if key != "observed_at"
                  }
              if isinstance(value, list):
                  items = [canonical(item) for item in value]
                  return sorted(
                      items,
                      key=lambda item: json.dumps(item, sort_keys=True, separators=(",", ":")),
                  )
              return value


          incoming_path = Path(sys.argv[1])
          existing_path = Path(sys.argv[2])
          incoming = canonical(json.loads(incoming_path.read_text(encoding="utf-8")))
          existing = canonical(json.loads(existing_path.read_text(encoding="utf-8")))
          sys.exit(0 if incoming == existing else 10)
          PY
            status=$?
            set -e

            if [[ $status -eq 0 ]]; then
              echo "changed=false" >>"$GITHUB_OUTPUT"
              rm -f "$temp_manifest"
              exit 0
            elif [[ $status -eq 10 ]]; then
              :
            else
              exit "$status"
            fi
          fi

          mkdir -p latest
          mv "$temp_manifest" latest/macos-latest.json
          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Publish manifest through a pull request
        if: steps.capture.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add latest/macos-latest.json

          if git diff --cached --quiet; then
            exit 0
          fi

          python3 scripts/validate_manifest_publication.py latest/macos-latest.json
          branch="bot/macos-latest-manifest"
          git checkout -B "$branch"
          git commit -m "Update macos-latest manifest"
          gh auth setup-git
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          head="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^)"
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Update macos-latest manifest" \
              --body "Automated runner capture. Only latest/macos-latest.json may change.")"
            pr="${pr##*/}"
          fi
          python3 scripts/validate_manifest_publication.py latest/macos-latest.json "$pr" "$head" "$base"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/merge" \
            -f sha="$head" -f merge_method=squash --jq 'if .merged then .sha else error(.message) end'
